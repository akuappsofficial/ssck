<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PROFITILIO</title><meta name="description" content="PROFITILIO personal portfolio"><style>
:root{--b:#080808;--w:#f4f1e8;--m:#aaa79f;--l:#292925;--a:#c7ff35}*{box-sizing:border-box}html,body{margin:0;background:var(--b);color:var(--w);font-family:Arial,Helvetica,sans-serif}a{color:inherit;text-decoration:none}.site{max-width:1500px;margin:auto;padding:0 28px}header{height:78px;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between}.logo{font-size:25px;font-weight:950;letter-spacing:-1.5px}.logo b{color:var(--a)}nav{display:flex;gap:26px}nav a,.kicker,.link,.back{font-size:12px;font-weight:950;letter-spacing:.1em;text-transform:uppercase}nav a:hover,.link:hover,.back:hover{color:var(--a)}main{padding-bottom:100px}.hero{min-height:calc(100vh - 78px);display:grid;grid-template-columns:1.3fr .7fr;align-items:end;padding:80px 0 55px;border-bottom:1px solid var(--l)}.kicker{color:var(--a);margin-bottom:24px}h1{font-size:clamp(75px,14vw,215px);line-height:.77;letter-spacing:-.075em;margin:0;font-weight:950}.hero p{font-size:22px;line-height:1.08;font-weight:850;max-width:470px;margin:0 0 35px}.link{display:inline-block;border-bottom:2px solid var(--a);padding-bottom:7px}.index{display:grid;grid-template-columns:100px 1fr 100px;padding:18px 0;border-bottom:1px solid var(--l);font-size:11px;font-weight:950;text-transform:uppercase}.right{text-align:right}.section,.page{padding:95px 0;border-bottom:1px solid var(--l)}.head{display:grid;grid-template-columns:100px 1fr;margin-bottom:48px}.num{color:var(--a);font-size:12px;font-weight:950}.title{font-size:clamp(55px,8vw,125px);line-height:.82;letter-spacing:-.06em;font-weight:950;margin:0}.projects{border-top:1px solid var(--l)}.project{display:grid;grid-template-columns:70px 1fr 250px 40px;gap:20px;padding:28px 0;border-bottom:1px solid var(--l);align-items:center}.project:hover .pt{color:var(--a)}.pn{color:var(--a);font-weight:950}.pt{font-size:clamp(30px,4vw,65px);font-weight:950;letter-spacing:-.045em}.pm{font-size:11px;line-height:1.5;font-weight:900;text-transform:uppercase;color:var(--m)}.arrow{font-size:27px;font-weight:950;text-align:right}.feature{display:grid;grid-template-columns:1fr 1fr}.art{background:var(--a);color:#080808;min-height:500px;padding:35px;display:flex;align-items:end}.art strong{font-size:clamp(85px,12vw,180px);line-height:.76;letter-spacing:-.08em;font-weight:950}.copy{border:1px solid var(--l);border-left:0;padding:50px;display:flex;flex-direction:column;justify-content:space-between}.copy h2{font-size:clamp(55px,7vw,105px);line-height:.8;letter-spacing:-.06em;margin:0;font-weight:950}.copy p,.body p{font-size:19px;line-height:1.4;font-weight:700;color:#d2d0c8}.about{display:grid;grid-template-columns:1fr 1fr;gap:80px}.about>p,.intro{font-size:clamp(25px,3vw,44px);line-height:1.02;font-weight:900;letter-spacing:-.035em;margin:0}.facts{border-top:1px solid var(--l)}.fact{display:flex;justify-content:space-between;border-bottom:1px solid var(--l);padding:17px 0;font-size:11px;font-weight:950;text-transform:uppercase}.fact span:last-child{color:var(--m);text-align:right}.contact h2{font-size:clamp(75px,14vw,190px);line-height:.77;letter-spacing:-.075em;font-weight:950;margin:0 0 50px}.page-top{display:flex;justify-content:space-between;border-bottom:1px solid var(--l);padding-bottom:22px}.page h1{margin:45px 0 55px;max-width:1150px}.body{display:grid;grid-template-columns:1fr 1fr;gap:70px;margin-top:65px}.routes{display:grid;grid-template-columns:1fr 1fr;margin-top:55px}.routes a{border-top:1px solid var(--l);padding:17px 0;font-size:14px;font-weight:950}.routes a:hover{color:var(--a)}footer{border-top:1px solid var(--l);padding:22px 0 35px;display:flex;justify-content:space-between;color:var(--m);font-size:10px;font-weight:950;text-transform:uppercase}@media(max-width:800px){.site{padding:0 17px}header{height:68px}nav{display:none}.hero{grid-template-columns:1fr;min-height:auto;padding:75px 0 45px;gap:65px}.hero p{font-size:19px}.section,.page{padding:70px 0}.head{grid-template-columns:55px 1fr}.project{grid-template-columns:42px 1fr 30px}.pm{display:none}.feature{grid-template-columns:1fr}.copy{border-left:1px solid var(--l);padding:30px;min-height:330px}.about,.body{grid-template-columns:1fr;gap:35px}.routes{grid-template-columns:1fr}footer{flex-direction:column;gap:15px}}</style></head><body><div class="site"><header><a class="logo" href="#/">PROFITILIO<b>.</b></a><nav><a href="#/">Home</a><a href="#/work">Work</a><a href="#/about">About</a><a href="#/journal">Journal</a><a href="#/contact">Contact</a></nav></header><main id="app"></main><footer><span>PROFITILIO / 2026</span><span>BUILT WITH INTENT</span><span>SRI LANKA</span></footer></div>
<script>
const P=[
["aku-code","01","AKU CODE","AI / SOFTWARE","AI coding environment and software experiments.","https://github.com/akuappsofficial/Aku-code"],
["akuos","02","AKUOS","OPERATING SYSTEM","Custom operating-system experiments and bootable builds.","https://github.com/akuappsofficial/Aku-code-ai"],
["sscpc","03","SSCPC","CREATIVE / WEB","Cinematic photography-club web experience.","https://sscpc.vercel.app/"],
["experiments","04","EXPERIMENTS","WEB / CSS / AI","Interfaces, visual algorithms and prototypes.","https://github.com/akuappsofficial"]
];
const extra=["approach","process","principles","toolbox","web","software","ai","design","css","javascript","research","prototypes","archive","gallery","notes","ideas","future","now","history","setup","workspace","interface","typography","visual-systems","responsive","accessibility","performance","github","open-source","experiments-css","experiments-ai","experiments-web","experiments-ui","experiments-os","aku-code/about","aku-code/build","aku-code/interface","aku-code/architecture","aku-code/features","aku-code/research","aku-code/versions","aku-code/github","aku-code/notes","akuos/about","akuos/build","akuos/boot","akuos/filesystem","akuos/desktop","akuos/networking","akuos/hardware","akuos/versions","akuos/github","akuos/notes","sscpc/about","sscpc/gallery","sscpc/spectrum","sscpc/committee","sscpc/join","sscpc/design","sscpc/photography","sscpc/web","experiments/image-to-css","experiments/pixel-art","experiments/generative","experiments/portfolio","experiments/layout","experiments/visual","experiments/tools","experiments/archive",...Array.from({length:10},(_,i)=>"journal/"+String(i+1).padStart(2,"0")),...Array.from({length:10},(_,i)=>"archive/"+String(i+1).padStart(2,"0"))];
function list(){return '<div class="projects">'+P.map(p=>'<a class="project" href="#/work/'+p[0]+'"><span class="pn">'+p[1]+'</span><span class="pt">'+p[2]+'</span><span class="pm">'+p[3]+'<br>'+p[4]+'</span><span class="arrow">↗</span></a>').join("")+'</div>'}
function home(){return '<section class="hero"><div><div class="kicker">PERSONAL PORTFOLIO / 2026</div><h1>PROFITILIO</h1></div><div><p>I BUILD DIGITAL THINGS.<br>Software, websites, systems and experiments made to exist outside the idea.</p><a class="link" href="#/work">ENTER THE WORK ↗</a></div></section><div class="index"><span>INDEX</span><span>SELECTED WORK</span><span class="right">04</span></div><section class="section"><div class="head"><span class="num">01</span><h2 class="title">WORK</h2></div>'+list()+'</section><section class="section"><div class="feature"><div class="art"><strong>AKU<br>CODE</strong></div><div class="copy"><h2>BUILD.<br>TEST.<br>SHIP.</h2><p>The portfolio is a record of projects that moved from an idea into something real.</p><a class="link" href="#/work/aku-code">OPEN PROJECT ↗</a></div></div></section><section class="section"><div class="head"><span class="num">02</span><h2 class="title">ABOUT</h2></div><div class="about"><p>PROFITILIO is a personal archive of things made from curiosity: software, websites, systems and experiments.</p><div class="facts"><div class="fact"><span>FOCUS</span><span>SOFTWARE / WEB / AI</span></div><div class="fact"><span>BASE</span><span>SRI LANKA</span></div><div class="fact"><span>MODE</span><span>BUILDING</span></div></div></div></section>'}
function basic(k,t,intro,body){return '<section class="page"><div class="page-top"><span class="kicker">'+k+'</span><a class="back" href="#/">HOME ↗</a></div><h1>'+t+'</h1><p class="intro">'+intro+'</p>'+body+'</section>'}
function work(){return basic("02 / WORK","SELECTED WORK.","Projects that moved from an idea into something real.",list())}
function about(){return basic("03 / ABOUT","ABOUT THE BUILDER.","A personal portfolio built around curiosity, making, breaking, rebuilding and shipping.",'<div class="body"><p>I like turning rough ideas into working interfaces and systems. Some become products. Some become experiments. All become evidence of the process.</p><div class="facts"><div class="fact"><span>INTERESTS</span><span>SOFTWARE / WEB / AI / SYSTEMS</span></div><div class="fact"><span>WORK STYLE</span><span>DIRECT / CURIOUS / ITERATIVE</span></div></div></div>')}
function journal(){return basic("04 / JOURNAL","THE JOURNAL.","Notes from the build process.",'<div class="routes">'+extra.filter(x=>x.startsWith("journal/")).map(x=>'<a href="#/'+x+'">'+x.toUpperCase()+' ↗</a>').join("")+'</div>')}
function contact(){return basic("05 / CONTACT","LET'S BUILD.","Have a project, idea or experiment worth making? Start the conversation.",'<div class="body"><p>EMAIL<br><br><a class="link" href="mailto:aku.apps.official@gmail.com">AKU.APPS.OFFICIAL@GMAIL.COM ↗</a></p><p>PUBLIC WORK<br><br><a class="link" href="https://github.com/akuappsofficial" target="_blank">GITHUB ↗</a></p></div>')}
function project(id){let p=P.find(x=>x[0]==id);if(!p)return null;return basic("WORK / "+p[1],p[2],p[4],'<div class="body"><div class="facts"><div class="fact"><span>CATEGORY</span><span>'+p[3]+'</span></div><div class="fact"><span>STATUS</span><span>ACTIVE ARCHIVE</span></div></div><p>This is the project record for '+p[2]+'. It can grow into a complete case study with screenshots, technical notes, milestones and external links.<br><br><a class="link" href="'+p[5]+'" target="_blank">VISIT PROJECT / SOURCE ↗</a></p></div>')}
function generated(path){let t=path.split("/").pop().replace(/-/g," ").toUpperCase();return basic("PROFITILIO / ARCHIVE",t+".","A dedicated page in the PROFITILIO archive for "+t.toLowerCase()+".",'<div class="body"><p>This route is a real page inside the portfolio and is ready for project-specific writing, images, documentation and links.</p><div class="facts"><div class="fact"><span>ROUTE</span><span>/'+path+'</span></div><div class="fact"><span>TYPE</span><span>PORTFOLIO ARCHIVE</span></div></div></div><div class="routes"><a href="#/work">ALL WORK ↗</a><a href="#/about">ABOUT ↗</a><a href="#/contact">CONTACT ↗</a></div>')}
function render(){let p=location.hash.replace(/^#\/?/,"").replace(/\/$/,"");let o=!p?home():p=="work"?work():p=="about"?about():p=="journal"?journal():p=="contact"?contact():p.startsWith("work/")?project(p.split("/")[1]):extra.includes(p)?generated(p):'<section class="page"><h1>404.</h1><a class="link" href="#/">RETURN HOME ↗</a></section>';document.getElementById("app").innerHTML=o;window.scrollTo(0,0)}addEventListener("hashchange",render);render();
</script></body></html>
